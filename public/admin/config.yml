# ScholarHelp admin panel (Sveltia CMS). Every save is a commit to GitHub, and the site rebuilds by itself.
backend:
  name: github
  repo: abderrahmanelr213-arch/scholarhelp
  branch: main
  # base_url: https://your-auth-worker.workers.dev  # optional, for "Sign in with GitHub" (see README)

site_url: https://scholarhelp.com
display_url: https://scholarhelp.com
logo_url: /brand-icon.png
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

i18n:
  structure: multiple_folders
  locales: [en, ar, ps]
  default_locale: en
  initial_locales: default

collections:
  - name: opportunities
    label: Opportunities
    label_singular: Opportunity
    folder: src/content/opportunities
    create: true
    i18n: true
    slug: "{{title}}"
    format: frontmatter
    extension: md
    sortable_fields: [published, deadline, title]
    summary: "{{title}} · {{category}} · {{deadline}}"
    view_filters:
      - { label: Scholarships, field: category, pattern: scholarships }
      - { label: Conferences, field: category, pattern: conferences }
      - { label: Exchange, field: category, pattern: exchange }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string, i18n: true, hint: "Name of the scholarship or event. Keep the official name." }
      - name: category
        label: Category
        widget: select
        i18n: duplicate
        options:
          - { label: University scholarship, value: scholarships }
          - { label: Fully funded conference, value: conferences }
          - { label: Cultural exchange program, value: exchange }
      - { name: summary, label: Short summary, widget: text, i18n: true, hint: "One or two sentences in your own words. Shown on cards and in Google results (about 150 characters)." }
      - { name: image, label: "Picture (university or organization logo)", widget: image, i18n: duplicate, required: false, hint: "Optional. Without a picture the card shows the country flag." }
      - { name: host, label: Offered by, widget: string, i18n: true, required: false }
      - { name: officialUrl, label: "Official announcement page", widget: string, i18n: duplicate, required: false, hint: "The Opportunity name links here. Leave empty to use the Apply link." }
      - { name: cardTitle, label: "Short headline for the card picture", widget: string, i18n: true, required: false }
      - { name: deadlineNote, label: "Second deadline / deadline note", widget: string, i18n: true, required: false, hint: "e.g. U.S. applicants: 15 March 2027, 11:55 PM Pacific Time" }
      - { name: hostUrl, label: "Organisation official website (homepage)", widget: string, i18n: duplicate, required: false, hint: "The Offered by name links here, e.g. https://www.ox.ac.uk/" }
      - { name: country, label: Host country, widget: string, i18n: true }
      - { name: countryCode, label: Country flag code, widget: string, i18n: duplicate, required: false, hint: "Two letters: gb, us, de, fr, tr, jp, kr, sa, ae, qa, cn, my... Use eu for Europe. Leave empty for worldwide." }
      - { name: location, label: "Location (city, country)", widget: string, i18n: true, required: false }
      - { name: duration, label: Duration, widget: string, i18n: true, required: false, hint: "e.g. 4 days, 2 years" }
      - { name: dates, label: Event or program dates, widget: string, i18n: true, required: false, hint: "e.g. 22 to 25 March 2027" }
      - { name: fee, label: Application fee, widget: string, i18n: true, required: false, hint: "As stated on the official site, e.g. None or USD 50. Leave empty if unknown." }
      - { name: eligible, label: Who can apply, widget: string, i18n: true, default: "All nationalities" }
      - name: levels
        label: Study level
        widget: select
        multiple: true
        i18n: duplicate
        options: [Bachelor, Master, PhD, Postdoc, Any]
      - name: funding
        label: Funding
        widget: select
        i18n: duplicate
        default: full
        options:
          - { label: Fully funded, value: full }
          - { label: Partially funded, value: partial }
          - { label: Travel grant, value: travel }
      - { name: deadline, label: Deadline, widget: datetime, i18n: duplicate, required: false, time_format: false, format: "YYYY-MM-DD", hint: "Leave empty if applications are open all year." }
      - { name: link, label: Official link, widget: string, i18n: duplicate, hint: "The official page where students apply. Must start with https://" }
      - { name: published, label: Date posted, widget: datetime, i18n: duplicate, time_format: false, format: "YYYY-MM-DD", default: "{{now}}" }
      - { name: featured, label: Featured, widget: boolean, i18n: duplicate, default: false, required: false }
      - { name: sample, label: Sample listing (shows a warning), widget: boolean, i18n: duplicate, default: false, required: false }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, i18n: duplicate, default: false, required: false }
      - { name: body, label: Full description, widget: markdown, i18n: true, hint: "Use headings: About, Financial benefits, Eligibility criteria, How to apply. Write in your own words." }

  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/content/guides
    create: true
    i18n: true
    slug: "{{title}}"
    format: frontmatter
    extension: md
    sortable_fields: [published, title]
    summary: "{{title}} · {{topic}}"
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: summary, label: Short summary, widget: text, i18n: true, hint: "One or two sentences, shown on cards and in Google results." }
      - name: topic
        label: Topic
        widget: select
        i18n: duplicate
        options:
          - { label: Applying, value: apply }
          - { label: Documents, value: documents }
          - { label: Visa & travel, value: visa }
          - { label: Tips, value: tips }
      - { name: published, label: Date posted, widget: datetime, i18n: duplicate, time_format: false, format: "YYYY-MM-DD", default: "{{now}}" }
      - { name: readingMinutes, label: Reading time (minutes), widget: number, value_type: int, i18n: duplicate, default: 5 }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, i18n: duplicate, default: false, required: false }
      - { name: body, label: Article, widget: markdown, i18n: true }
